name: deltasync

services:
  mysql:
    image: mysql:8.4.4
    command:
      - --defaults-extra-file=/etc/mysql/conf.d/deltasync.cnf
    environment:
      MYSQL_DATABASE: deltasync
      MYSQL_ROOT_PASSWORD: deltasync-root
      MYSQL_USER: app
      MYSQL_PASSWORD: deltasync-app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d/deltasync.cnf:/etc/mysql/conf.d/deltasync.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks: [deltasync]

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks: [deltasync]

  connect:
    image: quay.io/debezium/connect:2.7.3.Final
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: deltasync-connect
      CONFIG_STORAGE_TOPIC: _deltasync-connect-configs
      OFFSET_STORAGE_TOPIC: _deltasync-connect-offsets
      STATUS_STORAGE_TOPIC: _deltasync-connect-status
      ADVERTISED_HOST_NAME: connect
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      # The Debezium image maps CONNECT_* variables to worker properties.
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks: [deltasync]

  register-connector:
    image: curlimages/curl:8.10.1
    depends_on:
      connect:
        condition: service_healthy
    environment:
      CONNECT_URL: http://connect:8083
    volumes:
      - ./debezium/connector.json:/config/connector.json:ro
      - ./debezium/register-connector.sh:/scripts/register-connector.sh:ro
    entrypoint: ["/bin/sh", "/scripts/register-connector.sh"]
    restart: "no"
    networks: [deltasync]

  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      register-connector:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_PATTERN: deltasync\.deltasync\.(orders|customers)
      DELTA_ROOT: /data/delta
      CHECKPOINT_ROOT: /data/checkpoints
    ports:
      - "4040:4040"
    volumes:
      - delta_data:/data/delta
      - spark_checkpoints:/data/checkpoints
    init: true
    restart: unless-stopped
    networks: [deltasync]

networks:
  deltasync:
    driver: bridge

volumes:
  mysql_data:
  kafka_data:
  delta_data:
  spark_checkpoints:
